<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Boycott Ledger</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #e0e0e0;
      --red: #c62828;
      --orange: #ef6c00;
      --green: #2e7d32;
      --accent: #90caf9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--surface);
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid #333;
    }
    h1 { font-size: 1.2rem; font-weight: 500; }
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid #333;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      border-bottom: 3px solid transparent;
    }
    .tab.active {
      border-bottom-color: var(--accent);
      background: #252525;
    }
    .panel {
      display: none;
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .panel.active { display: block; }
    #reader {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 16px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    #result {
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      min-height: 80px;
      transition: background 0.2s;
    }
    #result.red { background: var(--red); color: #fff; }
    #result.orange { background: var(--orange); color: #fff; }
    #result.green { background: var(--green); color: #fff; }
    #result.neutral { background: var(--surface); }
    .search-box {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      background: var(--surface);
      border: 1px solid #444;
      border-radius: 6px;
      color: var(--text);
      font-size: 1rem;
    }
    .results { display: flex; flex-direction: column; gap: 8px; }
    .result-item {
      padding: 12px;
      border-radius: 6px;
      background: var(--surface);
      border-left: 6px solid #555;
    }
    .result-item.red { border-left-color: var(--red); }
    .result-item.orange { border-left-color: var(--orange); }
    .result-item.green { border-left-color: var(--green); }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-right: 8px;
    }
    .status-badge.red { background: var(--red); }
    .status-badge.orange { background: var(--orange); }
    .status-badge.green { background: var(--green); }
    .reason { margin-top: 6px; font-size: 0.9rem; opacity: 0.9; }
    @media (max-width: 480px) {
      .tab { font-size: 0.9rem; padding: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Boycott Ledger</h1>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="scanner">Scanner</button>
    <button class="tab" data-tab="search">Database Search</button>
  </nav>
  <main>
    <section id="scanner" class="panel active">
      <div id="reader"></div>
      <div id="result" class="neutral">Point camera at a barcode</div>
    </section>
    <section id="search" class="panel">
      <input type="text" id="search-input" class="search-box" placeholder="Search companies, studios, brands...">
      <div id="search-results" class="results"></div>
    </section>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    let db = { barcodes: {}, companies: {} };
    let scanner = null;
    let scannerActive = false;

    // Load database
    async function loadDatabase() {
      try {
        const res = await fetch('database.json');
        db = await res.json();
        console.log('Database loaded');
      } catch (e) {
        console.error('Failed to load database', e);
        document.getElementById('result').textContent = 'Failed to load database';
      }
    }

    // GS1 Japanese prefix check
    function isJapaneseOrigin(barcode) {
      if (!barcode || barcode.length < 3) return false;
      const prefix = parseInt(barcode.substring(0, 3), 10);
      return (prefix >= 450 && prefix <= 459) || (prefix >= 490 && prefix <= 499);
    }

    // Handle successful scan
    function onScanSuccess(decodedText) {
      const resultEl = document.getElementById('result');
      resultEl.className = '';
      
      if (isJapaneseOrigin(decodedText)) {
        resultEl.classList.add('red');
        resultEl.innerHTML = `<strong>Japanese Origin</strong><br>${decodedText}`;
        return;
      }

      const entry = db.barcodes[decodedText];
      if (entry) {
        resultEl.classList.add(entry.status);
        resultEl.innerHTML = `
          <span class="status-badge ${entry.status}">${entry.status}</span>
          <strong>${entry.company}</strong><br>
          <span class="reason">${entry.reason}</span>
        `;
      } else {
        resultEl.classList.add('neutral');
        resultEl.innerHTML = `Barcode: ${decodedText}<br>Not in database`;
      }
    }

    function onScanError(error) {
      // Ignore continuous scan errors
    }

    async function startScanner() {
      if (scannerActive) return;
      const readerEl = document.getElementById('reader');
      readerEl.innerHTML = '';
      
      scanner = new Html5Qrcode("reader");
      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 150 } },
          onScanSuccess,
          onScanError
        );
        scannerActive = true;
      } catch (err) {
        console.error('Scanner start failed', err);
        document.getElementById('result').textContent = 'Camera access failed. Check permissions.';
      }
    }

    async function stopScanner() {
      if (!scanner || !scannerActive) return;
      try {
        await scanner.stop();
        scanner.clear();
        scannerActive = false;
        document.getElementById('reader').innerHTML = '';
      } catch (err) {
        console.error('Scanner stop failed', err);
      }
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', async () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.getElementById(target).classList.add('active');

        if (target === 'scanner') {
          await startScanner();
        } else {
          await stopScanner();
        }
      });
    });

    // Search logic
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    function renderSearchResults(query) {
      searchResults.innerHTML = '';
      if (!query.trim()) return;

      const q = query.toLowerCase();
      const matches = Object.values(db.companies).filter(c =>
        c.name.toLowerCase().includes(q) || (c.reason && c.reason.toLowerCase().includes(q))
      );

      if (matches.length === 0) {
        searchResults.innerHTML = '<div class="result-item">No matches</div>';
        return;
      }

      matches.forEach(item => {
        const div = document.createElement('div');
        div.className = `result-item ${item.status}`;
        div.innerHTML = `
          <span class="status-badge ${item.status}">${item.status}</span>
          <strong>${item.name}</strong>
          <div class="reason">${item.reason}</div>
        `;
        searchResults.appendChild(div);
      });
    }

    searchInput.addEventListener('input', (e) => {
      renderSearchResults(e.target.value);
    });

    // Init
    loadDatabase().then(() => {
      // Start scanner on load since scanner tab is active
      startScanner();
    });

    // Optional: register service worker for basic PWA offline support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
